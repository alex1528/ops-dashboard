upstream opsapi_backend {
    least_conn; 
    server 127.0.0.1:6000 max_fails=3 fail_timeout=30s;
    keepalive 256; 
}

# --- 1. HTTP 强制跳转 HTTPS ---
server {
    listen 80;
    server_name ops.gslb.vip;
    location /health { return 200 "ok"; }
    location / { return 301 https://$host$request_uri; }
}

# --- 2. 主业务 HTTPS 配置 ---
server {
    listen 443 ssl;
    #http2 on;
    server_name ops.gslb.vip;

    ssl_certificate     /etc/nginx/certs/fanyu.gslb.vip.pem;
    ssl_certificate_key /etc/nginx/certs/fanyu.gslb.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # 代理公共配置（减少重复）
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 1800s;

    location / {
        proxy_pass http://opsapi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie 转发（关键）
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # CORS 跨域配置
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
}