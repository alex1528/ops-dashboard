services:
  ops-dashboard:
    image: ops-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    network_mode: host
    environment:
      - DATABASE_URL=file:/app/data/ops-dashboard.db
      # 必填项：未在仓库根目录 .env 中设置时，Compose 自身会以非零退出并给出
      # `${VAR:?...}` 的错误说明，避免容器静默地以空值启动后再被 Nest 抛错中断。
      # 注：整条 entry 用双引号包裹，避免 ${...} 的错误信息中出现 ": "（冒号 + 空格）
      # 被 YAML 解析器误认为映射分隔符，触发 `unexpected type map[string]interface {}`。
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须在仓库根目录 .env 中配置，建议使用 openssl rand -base64 48 生成}"
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - "MASTER_KEY=${MASTER_KEY:?MASTER_KEY 必须在仓库根目录 .env 中配置 64 位 hex 字符串，使用 openssl rand -hex 32 生成}"
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - "ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD 必须在仓库根目录 .env 中配置}"
      - HEALTH_CHECK_INTERVAL_MS=${HEALTH_CHECK_INTERVAL_MS:-60000}
      - HEALTH_CHECK_TIMEOUT_MS=${HEALTH_CHECK_TIMEOUT_MS:-10000}
      - PORT=6000
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_CRON=${BACKUP_CRON:-0 3 * * *}
      - BACKUP_DIR=/app/backup
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # OIDC / Authentik（可选，不配置则 OIDC 登录不启用）
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-ops-admin}
      - OIDC_SCOPES=${OIDC_SCOPES:-openid profile email}
      - OIDC_FRONTEND_URL=${OIDC_FRONTEND_URL:-}
    volumes:
      - db-data:/app/data
      - ./backup:/app/backup
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6000/api/health/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  db-data:
  # ./backup is a bind mount (not a named volume) so backup files are
  # directly accessible in the project root on the host machine.
